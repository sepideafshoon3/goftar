# Goftar default configuration. Copy to ./goftar.yaml (or pass --config) and edit.
# Unknown keys are rejected, so typos fail loudly.

engine: faster_whisper
model: large-v3-turbo   # tiny | base | small | medium | large-v3 | large-v3-turbo | CTranslate2 model dir
models_dir: models      # `goftar models download <name>` saves models here
device: auto            # auto (GPU if found, else CPU) | cpu | cuda
compute_type: auto      # auto = int8_float16 on GPU, int8 on CPU | float16 (GPU 8 GB+)
cpu_threads: 0          # 0 = library default; physical core count is a good value (6 on i5-11400H)
language: fa            # "auto" to detect the language
beam_size: 5
initial_prompt: ""      # a short Persian sentence with your domain vocabulary improves spelling
condition_on_previous_text: false   # false reduces repetition/hallucination on long files
offline: false          # true = never touch the network (sets HF_HUB_OFFLINE=1)

vad:
  enabled: true
  min_silence_ms: 500

audio:
  sample_rate: 16000
  denoise: false        # FFmpeg high-pass + noise reduction; helps noisy voice notes

postprocess:
  enabled: true
  fix_arabic_chars: true    # ي -> ی, ك -> ک
  remove_diacritics: true
  digits: persian           # persian | latin | keep
  half_space: true          # می رود -> می‌رود, کتاب ها -> کتاب‌ها
  punctuation: true         # , -> ،   ? -> ؟   spacing around punctuation
  spelling: false           # fix homophone-letter typos (ز/ذ/ض/ظ, س/ص/ث, ...) with a word list
  wordlist: ""              # file: one word per line (+ optional count); "" = hazm's list
  glossary: ""              # YAML file: wrong spelling -> right spelling (see glossary.example.yaml)
  use_hazm: false           # also run hazm's normalizer (pip install 'goftar[fa]')

cache:
  enabled: true
  path: .cache/goftar.sqlite
