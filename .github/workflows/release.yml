name: Release

# Push a tag like v0.2.0 to publish a GitHub release with the built wheel and sdist.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tag must match the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          tag = os.environ["TAG"].lstrip("v")
          base = tag.split("-", 1)[0]
          assert base == version, f"tag {tag!r} does not match pyproject version {version!r}"
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --generate-notes --title "$TAG" $flags
