name: Bug report
description: Something transcribes wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual result. Paste the transcript snippet if it is about quality.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `goftar doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command or config used
      render: shell
