[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goftar"
version = "0.1.0"
description = "Offline, free Persian speech-to-text engine: pluggable ASR backends, Persian-aware post-processing, CLI, REST API and web UI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikta Pournabi" }]
keywords = ["speech-to-text", "persian", "farsi", "whisper", "asr", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Persian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.0.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ui = ["gradio>=4.30"]
fa = ["hazm>=0.10"]
# CUDA 12 runtime libs for faster-whisper / CTranslate2 (NVIDIA GPUs).
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=5.0",
]
all = ["goftar[api,ui,fa,dev]"]

[project.scripts]
goftar = "goftar.interfaces.cli:app"

[project.urls]
Homepage = "https://github.com/niktapournabi/goftar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["goftar"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer/fastapi use function calls in defaults by design

[tool.ruff.lint.isort]
known-first-party = ["goftar"]
