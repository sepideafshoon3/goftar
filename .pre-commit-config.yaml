# Install with:  pre-commit install --install-hooks -t pre-commit -t commit-msg -t pre-push
# (scripts/setup.sh does this for you). Update pins with:  pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Without this, every hook below would also run on push. Hooks that need another stage say so.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]   # keeps model weights and audio out of git
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]   # work on feature branches, merge through pull requests

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: commit-message-format
        name: conventional commit message
        entry: scripts/check_commit_msg.py
        language: script
        stages: [commit-msg]
      - id: branch-name
        name: branch name convention
        entry: scripts/check_branch_name.py
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: pytest
        name: pytest (fast suite before push)
        entry: python -m pytest -q -x
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
